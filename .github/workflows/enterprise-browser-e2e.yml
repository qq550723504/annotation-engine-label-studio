name: Enterprise Browser E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - "label_studio/access_control/**"
      - "label_studio/projects/**"
      - "label_studio/tasks/**"
      - "label_studio/data_manager/**"
      - "web/apps/labelstudio/**"
      - "web/apps/labelstudio-e2e/**"
      - ".github/workflows/enterprise-browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-browser-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  POETRY_VERSION: 2.3.2
  DJANGO_SETTINGS_MODULE: core.settings.label_studio
  DJANGO_DB: sqlite
  COLLECT_ANALYTICS: "false"
  SENTRY_RATE: "0"
  JSON_LOG: "0"
  FRONTEND_HMR: "true"
  FRONTEND_HOSTNAME: "http://localhost:8010"
  DJANGO_HOSTNAME: "http://localhost:8080"

jobs:
  current-ui-validation:
    name: Current enterprise UI validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: poetry

      - name: Install backend OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt-dev python3-dev

      - name: Install backend dependencies
        run: poetry install --with test

      - name: Generate version file
        run: poetry run python label_studio/core/version.py

      - name: Migrate and seed enterprise E2E data
        run: |
          poetry run python label_studio/manage.py migrate --noinput
          poetry run python label_studio/manage.py seed_enterprise_e2e

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install frontend dependencies
        working-directory: web
        run: yarn install --frozen-lockfile

      - name: Start Django
        run: |
          nohup poetry run python label_studio/manage.py runserver 0.0.0.0:8080 > /tmp/label-studio-django.log 2>&1 &
          echo $! > /tmp/label-studio-django.pid

      - name: Start frontend HMR
        working-directory: web
        run: |
          nohup yarn ls:dev > /tmp/label-studio-frontend.log 2>&1 &
          echo $! > /tmp/label-studio-frontend.pid

      - name: Wait for application
        run: |
          for i in {1..90}; do
            if curl --fail --silent http://localhost:8080/health/ >/dev/null && curl --fail --silent http://localhost:8010/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Django log:"
          tail -200 /tmp/label-studio-django.log || true
          echo "Frontend log:"
          tail -200 /tmp/label-studio-frontend.log || true
          exit 1

      - name: Run current enterprise UI Cypress spec
        working-directory: web
        run: |
          yarn cypress run \
            --project apps/labelstudio-e2e \
            --config-file cypress.config.ts \
            --config baseUrl=http://localhost:8080,video=true \
            --spec src/e2e/enterprise-current-ui.cy.ts

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: enterprise-browser-e2e-artifacts
          if-no-files-found: ignore
          path: |
            web/apps/labelstudio-e2e/**/screenshots/**
            web/apps/labelstudio-e2e/**/videos/**
            /tmp/label-studio-django.log
            /tmp/label-studio-frontend.log
